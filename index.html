<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DIG</title><style>body{margin:0;overflow:hidden;background:#222;color:white;font:16px sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;pointer-events:none}#aim{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}#dig{position:fixed;right:24px;bottom:32px;padding:24px;border-radius:50%;touch-action:none}#move{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff55;touch-action:none;user-select:none;z-index:2}#stick{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:#ffffff88;transform:translate(-50%,-50%);pointer-events:none}button{touch-action:none;user-select:none}button{min-height:44px;border:1px solid #ffffff45;border-radius:9px;background:#23332fe8;color:#fff;padding:8px 12px;font:600 13px system-ui}button:disabled{opacity:.45}#hud{top:max(8px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));font:13px system-ui;text-shadow:0 1px 3px #000;max-width:75vw}#dig{right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:88px;height:88px;padding:0;background:#93652de8;border:2px solid #e9bc77;z-index:3}#tools button[aria-pressed=true]{color:#171b19}#inventory{max-width:65vw;white-space:normal}#mine-menu,#craft-menu{max-width:calc(100vw - 32px);max-height:calc(100dvh - 115px);overflow:auto;touch-action:pan-y;border:1px solid #ffffff44;border-radius:10px}#mine-menu button{display:block;width:100%;margin-bottom:4px}@media(max-height:450px){#move{width:104px;height:104px}#dig{width:76px;height:76px}#tools button{min-width:62px}}</style></head><body><div id="hud">DIG · P0</div><div id="aim">+</div><div id="move" aria-label="Movement joystick"><div id="stick"></div></div><button id="dig">DIG</button><script type="module" src="/src/main.ts"></script></body></html>
