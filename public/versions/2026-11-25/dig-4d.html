<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171411">
  <title>DIG · 4D 채굴</title>
  <style>
    *{box-sizing:border-box}
    html,body,#game{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#171411;color:#fff;font:15px system-ui,sans-serif;touch-action:none}
    #game{position:relative}
    #game canvas{display:block;width:100%;height:100%}
    #actions{position:absolute;z-index:8;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));display:grid;gap:10px}\n    #menu-items{display:grid;gap:10px}\n    #action-items{display:grid;gap:10px}\n    #action-items[hidden]{display:none}\n    #menu-items[hidden]{display:none}
    #actions button{min-width:132px;min-height:48px;padding:10px 14px;border:1px solid #d6a65a;border-radius:12px;background:#30261be8;color:#ffe4ae;font:700 14px system-ui;touch-action:manipulation}
    #actions button:active{transform:scale(.97);background:#49351f}
    #restore-panel{position:absolute;z-index:12;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,560px);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;border:1px solid #d6a65a;border-radius:16px;background:#201b16f5;color:#fff3dc;box-shadow:0 16px 60px #000b;touch-action:pan-y}
    #restore-panel[hidden]{display:none}
    #restore-panel h2{margin:8px 0 10px;font-size:20px}
    #restore-panel h3{margin:20px 0 8px;font-size:16px}
    #restore-panel p{line-height:1.5;color:#e2d4bc}
    #restore-panel label{display:block;margin:12px 0 6px;font-weight:700}
    #restore-panel textarea{display:block;width:100%;min-height:96px;padding:10px;border:1px solid #9b8058;border-radius:8px;background:#100e0c;color:#fff;font:12px ui-monospace,monospace;overflow-wrap:anywhere;touch-action:auto;user-select:text}
    #restore-panel button{margin:4px 4px 4px 0}
    #restore-message{min-height:1.5em}
    #reconnect-line{position:absolute;z-index:7;top:20%;left:50%;transform:translateX(-50%);max-width:min(80vw,520px);padding:10px 16px;border-radius:10px;background:#191713bb;color:#eee0c8;text-align:center;font:500 16px system-ui;pointer-events:none;animation:fade-line 5s forwards}
    @keyframes fade-line{0%,65%{opacity:1}100%{opacity:0}}
    #passage-sensor{position:absolute;z-index:7;top:max(16px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));max-width:calc(100% - 175px);padding:6px 9px;background:#171411dc;color:#ffe4ae;border-radius:6px;font-size:13px;pointer-events:none}
    #status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-height:430px){#actions{top:8px;right:8px;gap:6px}#actions button{min-height:40px;padding:6px 9px}#menu-items,#action-items{gap:6px}}
  </style>
  <script type="module" crossorigin src="./assets/dig4d-D3w2G2WX.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/input-Bu5NFKjX.js">
</head>
<body>
  <main id="game" aria-label="4차원 채굴 장면">
    <div id="actions">
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-items">메뉴</button>
      <div id="menu-items" hidden>
        <div id="action-items">
          <button id="upgrade" type="button">드릴 강화 · Lv 0</button>
          <button id="add-drill" type="button">드릴 추가 · 1대</button>
        </div>
        <button id="restore-toggle" type="button" aria-expanded="false" aria-controls="restore-panel">공유 코드</button>
        <button id="reset-record" type="button">처음부터 다시 시작</button>
      </div>
    </div>
    <section id="restore-panel" aria-labelledby="restore-title" hidden>
      <button id="restore-close" type="button">닫기</button>
      <h2 id="restore-title">진행 공유 코드</h2>
      <p>코드에는 열차 진행만 들어갑니다. 월드와 위치는 공유되지 않으며, 코드는 암호화되지 않아 누구나 읽고 수정할 수 있습니다.</p>
      <button id="copy-progress-code" type="button">현재 진행 코드 복사</button>
      <label for="backup-code">내 백업 코드</label>
      <textarea id="backup-code" readonly spellcheck="false" aria-describedby="restore-message"></textarea>
      <h3>공유 코드로 진행 복원</h3>
      <label for="restore-input">복원 코드를 붙여 넣으세요</label>
      <textarea id="restore-input" spellcheck="false" autocomplete="off"></textarea>
      <button id="restore-submit" type="button">백업 후 복원</button>
      <button id="manual-copy-confirm" type="button" hidden>직접 복사 완료, 복원 계속</button>
      <p id="restore-message" role="status" aria-live="polite"></p>
    </section>
    <div id="reconnect-line" hidden></div>
    <div id="passage-sensor" role="status" hidden>소형 통로 · 미세중력 감지</div>
    <div id="status" aria-live="polite"></div>
  </main>
</body>
</html>
