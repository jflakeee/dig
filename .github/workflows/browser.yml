name: Browser smoke
on:
  push:
    branches: [chore/toolchain-integration, feature/p4-exploration, feature/p7-visuals]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build -- --base=/dig/
      - run: |
          npx vite preview --host 127.0.0.1 --port 4173 --base=/dig/ > /tmp/dig-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/dig/ && break; sleep 1; done
          node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dig-browser-screenshots
          path: artifacts/
