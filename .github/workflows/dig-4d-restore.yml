name: DIG 4D restore smoke
on:
  push:
    branches: [feat/dig-4d-mode-foundation-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build -- --base=/dig/
      - name: Run 4D restore browser smoke
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --base=/dig/ > /tmp/dig-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/dig/dig-4d.html && break; sleep 1; done
          node --experimental-strip-types tests/dig-4d-restore-smoke.ts
          node --experimental-strip-types tests/dig-4d-portal-generation.ts
