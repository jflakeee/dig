<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#07090b" />
    <title>DIG · 심층 채굴</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main aria-label="채굴 기계 시야">
      <canvas id="scene" aria-label="화면을 드래그해 채굴 방향 변경"></canvas>
      <header>
        <output id="rock">일반 암석 <b>0</b><span id="rock-gain" aria-hidden="true" hidden>+1</span></output
        ><button id="menu" hidden aria-expanded="false">메뉴</button>
      </header>
      <span id="sensor" role="img" aria-label="중력 포탈 방향" hidden></span>
      <aside>
        <output id="fabrication" role="status" hidden></output>
        <output id="discovery-notice" role="status" hidden></output>
        <output id="message" role="status"></output>
        <output id="memory-line" hidden></output>
      </aside>
      <footer>
        <output id="hazard-alert" role="status" hidden></output>
        <button id="stabilize" hidden>저충격 밀봉 회수</button>
        <output id="capture-alert" role="alert" hidden></output>
        <button id="capture" hidden>시료 포집</button>
        <button id="emergency" hidden>긴급 레이저 채굴 <small>1.35초</small></button>
      </footer>
      <section id="panel" aria-label="메뉴" hidden>
        <output id="cargo"></output>
        <output id="materials"></output>
        <output id="minerals"></output>
        <details id="decomposer" hidden>
          <summary>분해기</summary>
          <label for="decompose-source">원료</label>
          <select id="decompose-source"></select>
          <output id="decompose-preview" for="decompose-source"></output>
          <button id="decompose">원료 1개 분해</button>
        </details>
        <details id="research" hidden>
          <summary>연구 <span id="research-status"></span></summary>
          <label for="research-source">분석 대상</label>
          <select id="research-source"></select>
          <output id="research-preview" for="research-source"></output>
          <button id="research-start">분석 시작</button>
          <button id="read-film" hidden>기억막 판독</button>
          <ul id="research-list"></ul>
          <details id="memory-book" hidden>
            <summary>관측 기록</summary>
            <ul id="memory-list"></ul>
          </details>
        </details>
        <details id="self-book" hidden>
          <summary>자기 기억 <span id="self-count"></span></summary>
          <ul id="self-list"></ul>
        </details>
        <details id="element-book" hidden>
          <summary>원소 도감 <span id="element-count"></span></summary>
          <p id="element-list"></p>
        </details>
        <details id="trade" hidden>
          <summary>거래 드론 <span id="credits"></span></summary>
          <p id="trader"></p>
          <label for="sell-source">판매</label>
          <select id="sell-source"></select>
          <button id="sell">판매</button>
          <div id="buy-list"></div>
          <label for="auction-source">경매 등록</label>
          <select id="auction-source"></select>
          <button id="auction">경매 등록</button>
          <ul id="auction-list"></ul>
          <ul id="trade-log"></ul>
        </details>
        <details id="stored" hidden>
          <summary>보관 물품 <span id="stored-count"></span></summary>
          <ul id="fitted-list"></ul>
          <ul id="stored-list"></ul>
          <button id="equip-head" hidden></button>
        </details>
        <details id="discoveries" hidden>
          <summary>발견 도감</summary>
          <ul id="discovery-list"></ul>
        </details>
        <button id="fire-ceramic" hidden>세라믹 가열 <small>암석 3개</small></button>
        <button id="repair" hidden>드릴 수리 <small>세라믹 1개</small></button>
        <button id="reset">처음부터 다시 시작</button>
        <div id="reset-prompt" hidden>
          <p>이 시험판의 기록을 지울까요?</p>
          <button id="confirm-reset">기록 지우고 시작</button>
        </div>
        <button id="close">닫기</button>
      </section>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
